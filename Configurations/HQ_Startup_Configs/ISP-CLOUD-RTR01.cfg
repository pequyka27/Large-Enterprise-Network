! ============================================================
! DEVICE: ISP-CLOUD-RTR01 (Cisco vIOS)
! ROLE: Simulated ISP Autonomous System AS 65100, Internet Simulation
! ============================================================

hostname ISP-CLOUD-RTR01
no ip domain-lookup
ip domain name isp.net
username admin privilege 15 secret Cisco123!
enable secret Cisco123!
crypto key generate rsa modulus 2048
ip ssh version 2
no ip http server
no ip http secure-server
service password-encryption
ip routing

line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 transport input ssh
 login local
!

! Simulated Internet DNS / Service Endpoint (8.8.8.8)
interface Loopback0
 description Simulated Internet Backbone (Google DNS)
 ip address 8.8.8.8 255.255.255.255
!

! WAN Links to Customer Edge Routers
interface GigabitEthernet0/0
 description WAN to HCMC-EDGE-RTR01
 ip address 203.0.113.1 255.255.255.252
 no keepalive
 no shutdown
!
interface GigabitEthernet0/1
 description WAN to HANOI-RND-RTR01
 ip address 198.51.100.1 255.255.255.252
 no keepalive
 no shutdown
!
interface GigabitEthernet0/2
 description WAN to DANANG-LOG-RTR01
 ip address 192.0.2.1 255.255.255.252
 no keepalive
 no shutdown
!

! BGP AS 65100 Configuration (Originates Default Route to all 3 sites)
router bgp 65100
 bgp log-neighbor-changes
 network 8.8.8.8 mask 255.255.255.255
 !
 neighbor 203.0.113.2 remote-as 65001
 neighbor 203.0.113.2 description HCMC-HQ
 neighbor 203.0.113.2 default-originate
 !
 neighbor 198.51.100.2 remote-as 65002
 neighbor 198.51.100.2 description HANOI-BRANCH
 neighbor 198.51.100.2 default-originate
 !
 neighbor 192.0.2.2 remote-as 65003
 neighbor 192.0.2.2 description DANANG-BRANCH
 neighbor 192.0.2.2 default-originate
!
end
