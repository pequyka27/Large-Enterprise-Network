! ============================================================
! DEVICE: HCMC-DIST-SW01 (Cisco vIOS-L2 / Layer 3 Multilayer Switch)
! ROLE: Distribution Switch 01, HSRP Active Gateway (Priority 110)
! ============================================================

hostname HCMC-DIST-SW01
no ip domain-lookup
ip domain name tvi.lab
username admin privilege 15 secret Cisco123!
enable secret Cisco123!
crypto key generate rsa modulus 2048
ip ssh version 2
no ip http server
no ip http secure-server
service password-encryption
ip routing
ipv6 unicast-routing

line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 transport input ssh
 login local
!

! ------------------------------------------------------------
! [P1] CAMPUS LAN, VLANS, STP, HSRP & IP SERVICES (Thành viên 1)
! ------------------------------------------------------------
vlan 10
 name EXEC_FINANCE
vlan 20
 name RND_ENGINEERING
vlan 30
 name LOGISTICS_OPS
vlan 40
 name GUEST
vlan 99
 name MANAGEMENT
vlan 100
 name HQ_TRANSIT
vlan 999
 name BLACKHOLE
!
spanning-tree mode rapid-pvst
spanning-tree vlan 1-4094 root secondary
!
! Port-Channel 1 to Core Switch
interface GigabitEthernet0/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 channel-group 1 mode active
!
interface GigabitEthernet0/2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 channel-group 1 mode active
!
interface Port-channel1
 description LACP Trunk to HCMC-CORE-SW01
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
!
! Cross-link to DIST-SW02
interface GigabitEthernet0/3
 description Backup Trunk to HCMC-DIST-SW02
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
!
! Access Ports for VPCS
interface GigabitEthernet1/0
 description PC-HQ-EXEC (VLAN 10)
 switchport access vlan 10
 switchport mode access
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet1/1
 description PC-HQ-GUEST (VLAN 40)
 switchport access vlan 40
 switchport mode access
 spanning-tree portfast
 no shutdown
!
! SVI Routing & HSRP Active Gateways (VIP = .1, Self = .2, Priority = 110 Preempt)
interface Vlan10
 description EXEC_FINANCE Gateway
 ip address 10.10.4.2 255.255.254.0
 standby version 2
 standby 10 ip 10.10.4.1
 standby 10 priority 110
 standby 10 preempt
 ip helper-address 10.10.254.1
 ipv6 address 2001:db8:7a1:110::2/64
 no shutdown
!
interface Vlan20
 description RND_ENGINEERING Gateway
 ip address 10.10.0.2 255.255.252.0
 standby version 2
 standby 20 ip 10.10.0.1
 standby 20 priority 110
 standby 20 preempt
 ip helper-address 10.10.254.1
 ipv6 address 2001:db8:7a1:120::2/64
 no shutdown
!
interface Vlan30
 description LOGISTICS_OPS Gateway
 ip address 10.10.8.2 255.255.255.0
 standby version 2
 standby 30 ip 10.10.8.1
 standby 30 priority 110
 standby 30 preempt
 ip helper-address 10.10.254.1
 ipv6 address 2001:db8:7a1:130::2/64
 no shutdown
!
interface Vlan40
 description GUEST Gateway
 ip address 10.10.6.2 255.255.254.0
 standby version 2
 standby 40 ip 10.10.6.1
 standby 40 priority 110
 standby 40 preempt
 ip helper-address 10.10.254.1
 ipv6 address 2001:db8:7a1:140::2/64
 no shutdown
!
interface Vlan99
 description MANAGEMENT Gateway
 ip address 192.168.1.2 255.255.255.0
 standby version 2
 standby 99 ip 192.168.1.1
 standby 99 priority 110
 standby 99 preempt
 no shutdown
!
interface Vlan100
 description Transit Link to Edge Router
 ip address 10.10.255.2 255.255.255.248
 ipv6 address 2001:db8:7a1:1ff::2/64
 no shutdown
!

! ------------------------------------------------------------
! [P2] ROUTING UNDERLAY (OSPFv2 / OSPFv3 Area 0) (Thành viên 2)
! ------------------------------------------------------------
interface Loopback0
 ip address 10.10.254.2 255.255.255.255
!
! OSPFv2: advertise HQ IPv4 routes; user VLANs remain passive.
router ospf 1
 router-id 10.10.254.2
 passive-interface default
 no passive-interface Vlan100
 network 10.10.254.2 0.0.0.0 area 0
 network 10.10.255.0 0.0.0.7 area 0
 network 10.10.0.0 0.0.255.255 area 0
 network 192.168.1.0 0.0.0.255 area 0
!

! OSPFv3: IPv6 routing in HQ Area 0.
ipv6 router ospf 1
 router-id 10.10.254.2
 passive-interface default
 no passive-interface Vlan100
!
interface Vlan10
 ipv6 ospf 1 area 0
!
interface Vlan20
 ipv6 ospf 1 area 0
!
interface Vlan30
 ipv6 ospf 1 area 0
!
interface Vlan40
 ipv6 ospf 1 area 0
!
interface Vlan100
 ipv6 ospf 1 area 0
!

! ------------------------------------------------------------
! [P4] SECURITY (ACLs & Port Hardening) (Thành viên 4)
! ------------------------------------------------------------
banner motd ^C Unauthorized access to TVI Corporate Infrastructure is prohibited. ^C
ntp server 10.10.254.1
!
end
