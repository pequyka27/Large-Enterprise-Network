! ============================================================
! DEVICE: HCMC-CORE-SW01 (Cisco vIOS-L2)
! ROLE: Campus Core Switch, Spanning-Tree Root Bridge
! ============================================================

! ------------------------------------------------------------
! [SYSTEM BASELINE]
! ------------------------------------------------------------
hostname HCMC-CORE-SW01
no ip domain-lookup
ip domain name tvi.lab
username admin privilege 15 secret Cisco123!
enable secret Cisco123!
crypto key generate rsa modulus 2048
ip ssh version 2
no ip http server
no ip http secure-server
service password-encryption

line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 transport input ssh
 login local
!

! ------------------------------------------------------------
! [P1] CAMPUS LAN, VLANS, TRUNKING, STP & ACCESS (Thành viên 1)
! ------------------------------------------------------------
! 1. VLAN Definitions
vtp mode transparent
vlan 10
 name EXEC_FINANCE
vlan 20
 name RND_ENGINEERING
vlan 30
 name LOGISTICS_OPS
vlan 40
 name GUEST
vlan 99
 name MANAGEMENT
vlan 100
 name HQ_TRANSIT
vlan 999
 name BLACKHOLE
!

! 2. Spanning Tree Protocol (Primary Root Bridge for all VLANs)
spanning-tree mode rapid-pvst
spanning-tree vlan 1-4094 root primary
!

! 3. Core-to-Distribution EtherChannels (LACP Active Trunking)
interface Port-channel1
 description LACP Trunk to HCMC-DIST-SW01
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
!
interface GigabitEthernet0/1
 description Trunk to HCMC-DIST-SW01 (Po1 Member)
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 channel-group 1 mode active
!
interface GigabitEthernet0/2
 description Trunk to HCMC-DIST-SW01 (Po1 Member)
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 channel-group 1 mode active
!
interface Port-channel2
 description LACP Trunk to HCMC-DIST-SW02
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
!
interface GigabitEthernet0/3
 description Trunk to HCMC-DIST-SW02 (Po2 Member)
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 channel-group 2 mode active
!
interface GigabitEthernet1/0
 description Trunk to HCMC-DIST-SW02 (Po2 Member)
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 channel-group 2 mode active
!

! 4. Transit Link to Edge Router
interface GigabitEthernet0/0
 description Link to HCMC-EDGE-RTR01 Gi0/1 (Access Transit VLAN 100)
 switchport access vlan 100
 switchport mode access
 no shutdown
!

! 5. Management SVI & Cloud Interface
interface GigabitEthernet1/1
 description Link to EVE Cloud1/pnet1 (Host Management)
 switchport access vlan 99
 switchport mode access
 spanning-tree portfast
 no shutdown
!
interface Vlan99
 description HQ Management In-Band SVI
 ip address 192.168.1.10 255.255.255.0
 no shutdown
 exit
 ipv6 address 2001:db8:7a1:199::10/64
!
! Disable L3 routing so ip default-gateway handles off-subnet management
no ip routing
ip default-gateway 192.168.1.1
!

! 6. Unused Port Hardening (VLAN 999 & Shutdown)
interface range GigabitEthernet1/2 - 3
 description UNUSED - BLACKHOLE
 switchport mode access
 switchport access vlan 999
 shutdown
 exit
!

! ------------------------------------------------------------
! [P4] SECURITY & AUTOMATION AUDIT (Thành viên 4)
! ------------------------------------------------------------
aaa new-model
aaa authentication login TVI_LOCAL local
aaa authorization exec TVI_LOCAL local
!
line vty 0 15
 transport input ssh
 login authentication TVI_LOCAL
 authorization exec TVI_LOCAL
 exec-timeout 10 0
!
banner motd #Unauthorized access to TVI Corporate Infrastructure is prohibited.#
logging buffered 64000 informational
ntp server 10.10.254.1
snmp-server group TVI_SNMP_GRP v3 priv
snmp-server user TVI_MON TVI_SNMP_GRP v3 auth sha TVI_Auth_2026! priv aes 128 TVI_Priv_2026!
!
end
