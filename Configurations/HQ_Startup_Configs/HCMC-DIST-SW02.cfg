! ============================================================
! DEVICE: HCMC-DIST-SW02 (Cisco vIOS-L2 / Layer 3 Multilayer Switch)
! ROLE: Distribution Switch 02, HSRP Standby Gateway (Priority 100)
! ============================================================

hostname HCMC-DIST-SW02
no ip domain-lookup
ip domain name tvi.lab
username admin privilege 15 secret Cisco123!
enable secret Cisco123!
crypto key generate rsa modulus 2048
ip ssh version 2
no ip http server
no ip http secure-server
service password-encryption
ip routing
ipv6 unicast-routing

line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 transport input ssh
 login local
!

! ------------------------------------------------------------
! [P1] CAMPUS LAN, VLANS, STP, HSRP & IP SERVICES (Thành viên 1)
! ------------------------------------------------------------
vtp mode transparent
vlan 10
 name EXEC_FINANCE
vlan 20
 name RND_ENGINEERING
vlan 30
 name LOGISTICS_OPS
vlan 40
 name GUEST
vlan 99
 name MANAGEMENT
vlan 100
 name HQ_TRANSIT
vlan 999
 name BLACKHOLE
!
spanning-tree mode rapid-pvst
!
! Port-Channel 2 to Core Switch
interface Port-channel2
 description LACP Trunk to HCMC-CORE-SW01
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
!
interface GigabitEthernet0/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 channel-group 2 mode active
!
interface GigabitEthernet0/2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 channel-group 2 mode active
!
! Cross-link to DIST-SW01
interface GigabitEthernet0/3
 description Backup Trunk to HCMC-DIST-SW01
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
!
! Access Ports for VPCS
interface GigabitEthernet1/0
 description PC-HQ-RND (VLAN 20)
 switchport access vlan 20
 switchport mode access
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface GigabitEthernet1/1
 description PC-HQ-LOG (VLAN 30)
 switchport access vlan 30
 switchport mode access
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
! SVI Routing & HSRP Standby Gateways (VIP = .1, Self = .3, Priority = 100 Preempt)
interface Vlan10
 description EXEC_FINANCE Gateway
 ip address 10.10.4.3 255.255.254.0
 standby version 2
 standby 10 ip 10.10.4.1
 standby 10 priority 100
 standby 10 preempt
 ip helper-address 10.10.254.1
 ipv6 address 2001:db8:7a1:110::3/64
 no shutdown
!
interface Vlan20
 description RND_ENGINEERING Gateway
 ip address 10.10.0.3 255.255.252.0
 standby version 2
 standby 20 ip 10.10.0.1
 standby 20 priority 100
 standby 20 preempt
 ip helper-address 10.10.254.1
 ipv6 address 2001:db8:7a1:120::3/64
 no shutdown
!
interface Vlan30
 description LOGISTICS_OPS Gateway
 ip address 10.10.8.3 255.255.255.0
 standby version 2
 standby 30 ip 10.10.8.1
 standby 30 priority 100
 standby 30 preempt
 ip helper-address 10.10.254.1
 ipv6 address 2001:db8:7a1:130::3/64
 no shutdown
!
interface Vlan40
 description GUEST Gateway
 ip address 10.10.6.3 255.255.254.0
 standby version 2
 standby 40 ip 10.10.6.1
 standby 40 priority 100
 standby 40 preempt
 ip helper-address 10.10.254.1
 ipv6 address 2001:db8:7a1:140::3/64
 no shutdown
!
interface Vlan99
 description MANAGEMENT Gateway
 ip address 192.168.1.3 255.255.255.0
 standby version 2
 standby 99 ip 192.168.1.1
 standby 99 priority 100
 standby 99 preempt
 no shutdown
 ipv6 address 2001:db8:7a1:199::3/64
!
interface Vlan100
 description Transit Link to Edge Router
 ip address 10.10.255.3 255.255.255.248
 ipv6 address 2001:db8:7a1:1ff::3/64
 no shutdown
!

! Unused Port Hardening (VLAN 999 + shutdown) - P1
interface range GigabitEthernet0/0 , GigabitEthernet1/2 - 3
 description UNUSED - BLACKHOLE
 switchport mode access
 switchport access vlan 999
 shutdown
!

! ------------------------------------------------------------
! [P2] ROUTING UNDERLAY (OSPFv2 / OSPFv3 Area 0) (Thành viên 2)
! ------------------------------------------------------------
interface Loopback0
 ip address 10.10.254.3 255.255.255.255
!
! OSPFv2: advertise HQ IPv4 routes; user VLANs remain passive.
router ospf 1
 router-id 10.10.254.3
 passive-interface default
 no passive-interface Vlan100
 network 10.10.254.3 0.0.0.0 area 0
 network 10.10.255.0 0.0.0.7 area 0
 network 10.10.0.0 0.0.255.255 area 0
 network 192.168.1.0 0.0.0.255 area 0
!
! OSPFv3: vIOS-L2 15.2(CML_NIGHTLY_20180619)FLO_DSGS7 does not support OSPFv3 (ipv6 router ospf).
! Keep IPv6 SVI addressing above and use static default IPv6 route to HQ Edge via VLAN 100.
ipv6 route ::/0 2001:db8:7a1:1ff::1
!

! ------------------------------------------------------------
! [P4] SECURITY (ACLs & Port Hardening) (Thành viên 4)
! ------------------------------------------------------------
ip access-list extended GUEST_IN
 permit udp any eq bootpc any eq bootps
 permit udp host 10.10.255.1 eq bootps 10.10.6.0 0.0.1.255 eq bootps
 permit udp host 10.10.254.1 eq bootps 10.10.6.0 0.0.1.255 eq bootps
 permit udp any host 10.10.254.1 eq domain
 permit tcp any host 10.10.254.1 eq domain
 deny ip any 10.0.0.0 0.255.255.255
 deny ip any 192.168.0.0 0.0.255.255
 permit ip any any
!
ipv6 access-list GUEST_V6_IN
 permit icmp any any nd-ns
 permit icmp any any nd-na
 permit icmp any any router-solicitation
 permit udp any eq 546 any eq 547
 deny ipv6 any 2001:db8:7a1::/48
 deny ipv6 any fc00::/7
 deny ipv6 any fe80::/10
 permit ipv6 any any
!
interface Vlan40
 ip access-group GUEST_IN in
 ipv6 traffic-filter GUEST_V6_IN in
!
interface GigabitEthernet1/0
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree bpduguard enable
!
interface GigabitEthernet1/1
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree bpduguard enable
!
aaa new-model
aaa authentication login TVI_LOCAL local
aaa authorization exec TVI_LOCAL local
!
line vty 0 15
 transport input ssh
 login authentication TVI_LOCAL
 authorization exec TVI_LOCAL
 exec-timeout 10 0
!
banner motd #Unauthorized access to TVI Corporate Infrastructure is prohibited.#
logging buffered 64000 informational
ntp server 10.10.254.1
snmp-server group TVI_SNMP_GRP v3 priv
snmp-server user TVI_MON TVI_SNMP_GRP v3 auth sha TVI_Auth_2026! priv aes 128 TVI_Priv_2026!
!
end
