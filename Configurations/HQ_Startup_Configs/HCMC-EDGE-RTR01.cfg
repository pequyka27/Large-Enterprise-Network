! ============================================================
! DEVICE: HCMC-EDGE-RTR01 (Cisco vIOS)
! ROLE: HQ Edge Router, eBGP with ISP, IPsec Hub, NAT/PAT, Central DHCP & DNS
! ============================================================

hostname HCMC-EDGE-RTR01
no ip domain-lookup
ip domain name tvi.lab
username admin privilege 15 secret Cisco123!
enable secret Cisco123!
crypto key generate rsa modulus 2048
ip ssh version 2
no ip http server
no ip http secure-server
service password-encryption
ip routing
ipv6 unicast-routing

line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 transport input ssh
 login local
!

! ------------------------------------------------------------
! [P1] CENTRAL DHCP & DNS SERVICES (Thành viên 1)
! ------------------------------------------------------------
! Excluded Gateway and Static IP ranges
ip dhcp excluded-address 10.10.0.1 10.10.0.10
ip dhcp excluded-address 10.10.4.1 10.10.4.10
ip dhcp excluded-address 10.10.6.1 10.10.6.10
ip dhcp excluded-address 10.10.8.1 10.10.8.10
ip dhcp excluded-address 10.20.0.1 10.20.0.10
ip dhcp excluded-address 10.20.4.1 10.20.4.10
ip dhcp excluded-address 10.20.6.1 10.20.6.10
ip dhcp excluded-address 10.20.7.1 10.20.7.10
ip dhcp excluded-address 10.30.0.1 10.30.0.10
ip dhcp excluded-address 10.30.4.1 10.30.4.10
ip dhcp excluded-address 10.30.5.1 10.30.5.10
ip dhcp excluded-address 10.30.5.65 10.30.5.75
!
! HQ DHCP Pools
ip dhcp pool HQ_RND
 network 10.10.0.0 255.255.252.0
 default-router 10.10.0.1
 dns-server 10.10.254.1
 domain-name tvi.lab
!
ip dhcp pool HQ_EXEC
 network 10.10.4.0 255.255.254.0
 default-router 10.10.4.1
 dns-server 10.10.254.1
 domain-name tvi.lab
!
ip dhcp pool HQ_GUEST
 network 10.10.6.0 255.255.254.0
 default-router 10.10.6.1
 dns-server 10.10.254.1
!
ip dhcp pool HQ_LOG
 network 10.10.8.0 255.255.255.0
 default-router 10.10.8.1
 dns-server 10.10.254.1
 domain-name tvi.lab
!
! Hanoi DHCP Pools
ip dhcp pool HN_RND
 network 10.20.0.0 255.255.252.0
 default-router 10.20.0.1
 dns-server 10.10.254.1
 domain-name tvi.lab
!
ip dhcp pool HN_GUEST
 network 10.20.4.0 255.255.254.0
 default-router 10.20.4.1
 dns-server 10.10.254.1
!
ip dhcp pool HN_EXEC
 network 10.20.6.0 255.255.255.0
 default-router 10.20.6.1
 dns-server 10.10.254.1
 domain-name tvi.lab
!
ip dhcp pool HN_LOG
 network 10.20.7.0 255.255.255.192
 default-router 10.20.7.1
 dns-server 10.10.254.1
 domain-name tvi.lab
!
! Da Nang DHCP Pools
ip dhcp pool DN_LOG
 network 10.30.0.0 255.255.252.0
 default-router 10.30.0.1
 dns-server 10.10.254.1
 domain-name tvi.lab
!
ip dhcp pool DN_GUEST
 network 10.30.4.0 255.255.255.0
 default-router 10.30.4.1
 dns-server 10.10.254.1
!
ip dhcp pool DN_EXEC
 network 10.30.5.0 255.255.255.192
 default-router 10.30.5.1
 dns-server 10.10.254.1
 domain-name tvi.lab
!
ip dhcp pool DN_RND
 network 10.30.5.64 255.255.255.224
 default-router 10.30.5.65
 dns-server 10.10.254.1
 domain-name tvi.lab
!
! Local DNS Server
ip dns server
ip host edge.tvi.lab 10.10.254.1
ip host core.tvi.lab 10.10.254.2
!

! ------------------------------------------------------------
! [P2] ROUTING UNDERLAY, OSPF & EBGP (Thành viên 2)
! ------------------------------------------------------------
interface Loopback0
 ip address 10.10.254.1 255.255.255.255
!
interface GigabitEthernet0/1
 description HQ Transit to HCMC-CORE-SW01 (VLAN 100)
 ip address 10.10.255.1 255.255.255.248
 ipv6 address 2001:db8:7a1:1ff::1/64
 ipv6 ospf 1 area 0
 no keepalive
 no shutdown
!
interface GigabitEthernet0/0
 description WAN to ISP-CLOUD-RTR01
 ip address 203.0.113.2 255.255.255.252
 no keepalive
 no shutdown
!
router ospf 1
 router-id 10.10.254.1
 passive-interface default
 no passive-interface GigabitEthernet0/1
 no passive-interface Tunnel10
 no passive-interface Tunnel20
 default-information originate
 network 10.10.254.1 0.0.0.0 area 0
 network 10.10.255.0 0.0.0.7 area 0
 network 10.255.255.0 0.0.0.3 area 0
 network 10.255.255.4 0.0.0.3 area 0
!
ipv6 router ospf 1
 router-id 10.10.254.1
 passive-interface default
 no passive-interface GigabitEthernet0/1
!
router bgp 65001
 bgp log-neighbor-changes
 neighbor 203.0.113.1 remote-as 65100
 neighbor 203.0.113.1 description ISP-CLOUD-RTR01
 network 203.0.113.0 mask 255.255.255.252
!

! ------------------------------------------------------------
! [P3] WAN OVERLAY (GRE/IPSEC) & QOS (Thành viên 3)
! ------------------------------------------------------------
crypto isakmp policy 10
 encr aes 256
 hash sha256
 authentication pre-share
 group 14
!
crypto isakmp key TVI_Secret_Key2026! address 198.51.100.2
crypto isakmp key TVI_Secret_Key2026! address 192.0.2.2
!/
crypto ipsec transform-set TVI-TS esp-aes 256 esp-sha256-hmac
 mode transport
!
crypto ipsec profile TVI-PROF
 set transform-set TVI-TS
!
interface Tunnel10
 description GRE over IPsec to HANOI-RND-RTR01
 ip address 10.255.255.1 255.255.255.252
 ip mtu 1400
 ip tcp adjust-mss 1360
 ip ospf network point-to-point
 tunnel source GigabitEthernet0/0
 tunnel destination 198.51.100.2
 tunnel protection ipsec profile TVI-PROF
 qos pre-classify
!
interface Tunnel20
 description GRE over IPsec to DANANG-LOG-RTR01
 ip address 10.255.255.5 255.255.255.252
 ip mtu 1400
 ip tcp adjust-mss 1360
 ip ospf network point-to-point
 tunnel source GigabitEthernet0/0
 tunnel destination 192.0.2.2
 tunnel protection ipsec profile TVI-PROF
 qos pre-classify
!
! 4. QoS DiffServ MQC (Egress Queuing on WAN)
ip access-list extended ACL_QOS_VOICE
 permit udp any any range 16384 32767
 permit udp any any eq 5060
!
ip access-list extended ACL_QOS_VIDEO
 permit udp any any range 5004 5005
!
class-map match-any CM_VOICE
 match access-group name ACL_QOS_VOICE
 match ip dscp ef
!
class-map match-any CM_VIDEO
 match access-group name ACL_QOS_VIDEO
 match ip dscp af31
!
policy-map TVI_WAN_QOS_POLICY
 class CM_VOICE
  priority percent 20
 class CM_VIDEO
  bandwidth percent 30
 class class-default
  fair-queue
!
interface GigabitEthernet0/0
 service-policy output TVI_WAN_QOS_POLICY
!

! ------------------------------------------------------------
! [P4] SECURITY (NAT/PAT & ACLS) (Thành viên 4)
! ------------------------------------------------------------
interface GigabitEthernet0/0
 ip nat outside
!
interface GigabitEthernet0/1
 ip nat inside
!
ip access-list extended NAT_INSIDE
 deny ip 10.0.0.0 0.255.255.255 10.0.0.0 0.255.255.255
 deny ip 10.0.0.0 0.255.255.255 192.168.0.0 0.0.255.255
 permit ip 10.0.0.0 0.255.255.255 any
!
ip nat inside source list NAT_INSIDE interface GigabitEthernet0/0 overload
!
ntp master 3
aaa new-model
aaa authentication login TVI_LOCAL local
aaa authorization exec TVI_LOCAL local
!
line vty 0 15
 transport input ssh
 login authentication TVI_LOCAL
 authorization exec TVI_LOCAL
 exec-timeout 10 0
!
banner motd #Unauthorized access to TVI Corporate Infrastructure is prohibited.#
logging buffered 64000 informational
!
end
