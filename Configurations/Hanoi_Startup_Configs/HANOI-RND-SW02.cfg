! ============================================================
! DEVICE: HANOI-RND-SW02 (Cisco vIOS-L2)
! ROLE: Hanoi Access Switch, L2 Security Enforcement (Port Sec, Snooping, DAI)
! ============================================================

hostname HANOI-RND-SW02
no ip domain-lookup
ip domain name tvi.lab
username admin privilege 15 secret Cisco123!
enable secret Cisco123!
crypto key generate rsa modulus 2048
ip ssh version 2
no ip http server
no ip http secure-server
service password-encryption

line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 transport input ssh
 login local
!

! ------------------------------------------------------------
! [P1] CAMPUS LAN, VLANS, TRUNKING (Thành viên 1)
! ------------------------------------------------------------
vtp mode transparent
vlan 10
 name EXEC_FINANCE
vlan 20
 name RND_ENGINEERING
vlan 30
 name LOGISTICS_OPS
vlan 40
 name GUEST
vlan 99
 name MANAGEMENT
vlan 999
 name BLACKHOLE
!
spanning-tree mode rapid-pvst
!
! Port-Channel 1 to Distribution Switch
interface GigabitEthernet0/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 channel-group 1 mode active
!
interface GigabitEthernet0/2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 channel-group 1 mode active
!
interface Port-channel1
 description LACP Uplink to HANOI-RND-SW01 (Trusted Uplink)
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
!
! Access Ports for VPCS
interface GigabitEthernet1/0
 description PC-HN-RND (VLAN 20)
 switchport access vlan 20
 switchport mode access
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface GigabitEthernet1/1
 description PC-HN-GUEST (VLAN 40)
 switchport access vlan 40
 switchport mode access
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
! Management SVI
interface Vlan99
 description Hanoi Access Management SVI
 ip address 192.168.2.11 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.2.1
!

! Unused Port Hardening (VLAN 999 + shutdown) - P1
interface range GigabitEthernet0/0 , GigabitEthernet0/3 , GigabitEthernet1/2 - 3 , GigabitEthernet2/0 - 3
 description UNUSED - BLACKHOLE
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface range GigabitEthernet3/0 - 3
 description UNUSED - BLACKHOLE
 switchport mode access
 switchport access vlan 999
 shutdown
!

! ------------------------------------------------------------
! [P4] LAYER 2 SECURITY & HARDENING (Thành viên 4)
! ------------------------------------------------------------
! DHCP Snooping
ip dhcp snooping
ip dhcp snooping vlan 10,20,30,40
no ip dhcp snooping information option
!
interface Port-channel1
 ip dhcp snooping trust
 ip arp inspection trust
!
! Dynamic ARP Inspection
ip arp inspection vlan 10,20,30,40
!
! Port Security on Access Ports
interface GigabitEthernet1/0
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
!
interface GigabitEthernet1/1
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
!
banner motd ^C Unauthorized access to TVI Corporate Infrastructure is prohibited. ^C
ntp server 10.10.254.1
!
end
