! ============================================================
! DEVICE: HANOI-RND-RTR01 (Cisco vIOS)
! ROLE: Hanoi Edge Router, Router-on-a-Stick, eBGP, IPsec Spoke, NAT
! ============================================================

hostname HANOI-RND-RTR01
no ip domain-lookup
ip domain name tvi.lab
username admin privilege 15 secret Cisco123!
enable secret Cisco123!
crypto key generate rsa modulus 2048
ip ssh version 2
no ip http server
no ip http secure-server
service password-encryption
ip routing
ipv6 unicast-routing

line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 transport input ssh
 login local
!

! ------------------------------------------------------------
! [P1] ROUTER-ON-A-STICK & DHCP RELAY (Thành viên 1)
! ------------------------------------------------------------
interface GigabitEthernet0/1
 description Trunk to HANOI-RND-SW01
 no ip address
 no shutdown
!
interface GigabitEthernet0/1.10
 description EXEC_FINANCE Gateway
 encapsulation dot1Q 10
 ip address 10.20.6.1 255.255.255.0
 ip helper-address 10.10.254.1
!
interface GigabitEthernet0/1.20
 description RND_ENGINEERING Gateway
 encapsulation dot1Q 20
 ip address 10.20.0.1 255.255.252.0
 ip helper-address 10.10.254.1
 ipv6 address 2001:db8:7a1:220::1/64
!
interface GigabitEthernet0/1.30
 description LOGISTICS_OPS Gateway
 encapsulation dot1Q 30
 ip address 10.20.7.1 255.255.255.192
 ip helper-address 10.10.254.1
!
interface GigabitEthernet0/1.40
 description GUEST Gateway
 encapsulation dot1Q 40
 ip address 10.20.4.1 255.255.254.0
 ip helper-address 10.10.254.1
!
interface GigabitEthernet0/1.99
 description MANAGEMENT Gateway
 encapsulation dot1Q 99
 ip address 192.168.2.1 255.255.255.0
!

! ------------------------------------------------------------
! [P2] ROUTING UNDERLAY, OSPF AREA 1 & EBGP (Thành viên 2)
! ------------------------------------------------------------
interface Loopback0
 ip address 10.20.254.1 255.255.255.255
!
interface GigabitEthernet0/0
 description WAN to ISP-CLOUD-RTR01
 ip address 198.51.100.2 255.255.255.252
 no keepalive
 no shutdown
!
router ospf 1
 router-id 10.20.254.1
 passive-interface GigabitEthernet0/1.10
 passive-interface GigabitEthernet0/1.20
 passive-interface GigabitEthernet0/1.30
 passive-interface GigabitEthernet0/1.40
 passive-interface GigabitEthernet0/1.99
 area 1 range 10.20.0.0 255.255.0.0
 network 10.20.254.1 0.0.0.0 area 1
 network 10.20.0.0 0.0.255.255 area 1
 network 10.255.255.0 0.0.0.3 area 0
!
router bgp 65002
 bgp log-neighbor-changes
 neighbor 198.51.100.1 remote-as 65100
 neighbor 198.51.100.1 description ISP-CLOUD-RTR01
 network 198.51.100.0 mask 255.255.255.252
!

! ------------------------------------------------------------
! [P3] WAN OVERLAY (IPSEC SPOKE) & QOS (Thành viên 3)
! ------------------------------------------------------------
crypto isakmp policy 10
 encr aes 256
 hash sha256
 authentication pre-share
 group 14
!
crypto isakmp key TVI_Secret_Key2026! address 203.0.113.2
!
crypto ipsec transform-set TVI-TS esp-aes 256 esp-sha256-hmac
 mode transport
!
crypto ipsec profile TVI-PROF
 set transform-set TVI-TS
!
interface Tunnel10
 description GRE over IPsec to HCMC-EDGE-RTR01
 ip address 10.255.255.2 255.255.255.252
 ip mtu 1400
 ip tcp adjust-mss 1360
 ip ospf network point-to-point
 tunnel source GigabitEthernet0/0
 tunnel destination 203.0.113.2
 tunnel protection ipsec profile TVI-PROF
 qos pre-classify
!
! QoS DiffServ MQC (Egress Queuing on WAN)
ip access-list extended ACL_QOS_VOICE
 permit udp any any range 16384 32767
 permit udp any any eq 5060
!
ip access-list extended ACL_QOS_VIDEO
 permit udp any any range 5004 5005
!
class-map match-any CM_VOICE
 match access-group name ACL_QOS_VOICE
 match ip dscp ef
!
class-map match-any CM_VIDEO
 match access-group name ACL_QOS_VIDEO
 match ip dscp af31
!
policy-map TVI_WAN_QOS_POLICY
 class CM_VOICE
  priority percent 20
 class CM_VIDEO
  bandwidth percent 30
 class class-default
  fair-queue
!
interface GigabitEthernet0/0
 service-policy output TVI_WAN_QOS_POLICY
!

! ------------------------------------------------------------
! [P4] SECURITY (NAT/PAT & ACLS) (Thành viên 4)
! ------------------------------------------------------------
interface GigabitEthernet0/0
 ip nat outside
!
interface GigabitEthernet0/1.10
 ip nat inside
!
interface GigabitEthernet0/1.20
 ip nat inside
!
interface GigabitEthernet0/1.30
 ip nat inside
!
interface GigabitEthernet0/1.40
 ip nat inside
!
ip access-list standard NAT_INSIDE
 deny 10.0.0.0 0.255.255.255
 permit 10.20.0.0 0.0.255.255
!
ip nat inside source list NAT_INSIDE interface GigabitEthernet0/0 overload
!
banner motd ^C Unauthorized access to TVI Corporate Infrastructure is prohibited. ^C
ntp server 10.10.254.1
!
end
