! ============================================================
! DEVICE: HANOI-RND-SW01 (Cisco vIOS-L2)
! ROLE: Hanoi Campus Distribution Switch, Local STP Root
! ============================================================

hostname HANOI-RND-SW01
no ip domain-lookup
ip domain name tvi.lab
username admin privilege 15 secret Cisco123!
enable secret Cisco123!
crypto key generate rsa modulus 2048
ip ssh version 2
no ip http server
no ip http secure-server
service password-encryption

line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 transport input ssh
 login local
!

! ------------------------------------------------------------
! [P1] CAMPUS LAN, VLANS, TRUNKING & STP (Thành viên 1)
! ------------------------------------------------------------
vtp mode transparent
vlan 10
 name EXEC_FINANCE
vlan 20
 name RND_ENGINEERING
vlan 30
 name LOGISTICS_OPS
vlan 40
 name GUEST
vlan 99
 name MANAGEMENT
vlan 999
 name BLACKHOLE
!
spanning-tree mode rapid-pvst
spanning-tree vlan 1-4094 root primary
!
! Uplink to Router
interface GigabitEthernet0/0
 description Trunk to HANOI-RND-RTR01 Gi0/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 no shutdown
!
! Port-Channel 1 to Access Switch
interface Port-channel1
 description LACP Trunk to HANOI-RND-SW02
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
!
interface GigabitEthernet0/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 channel-group 1 mode active
!
interface GigabitEthernet0/2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport nonegotiate
 channel-group 1 mode active
!
! Access Port for Executive PC
interface GigabitEthernet1/0
 description PC-HN-EXEC (VLAN 10)
 switchport access vlan 10
 switchport mode access
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
! Management SVI
interface Vlan99
 description Hanoi Management SVI
 ip address 192.168.2.10 255.255.255.0
 no shutdown
 exit
!
no ip routing
ip default-gateway 192.168.2.1
!

! Unused Port Hardening (VLAN 999 + shutdown) - P1
interface range GigabitEthernet0/3 , GigabitEthernet1/1 - 3
 description UNUSED - BLACKHOLE
 switchport mode access
 switchport access vlan 999
 shutdown
 exit
!

! ------------------------------------------------------------
! [P4] SECURITY & AUTOMATION (Thành viên 4)
! ------------------------------------------------------------
interface GigabitEthernet1/0
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree bpduguard enable
!
aaa new-model
aaa authentication login TVI_LOCAL local
aaa authorization exec TVI_LOCAL local
!
line vty 0 15
 transport input ssh
 login authentication TVI_LOCAL
 authorization exec TVI_LOCAL
 exec-timeout 10 0
!
banner motd #Unauthorized access to TVI Corporate Infrastructure is prohibited.#
logging buffered 64000 informational
ntp server 10.10.254.1
snmp-server group TVI_SNMP_GRP v3 priv
snmp-server user TVI_MON TVI_SNMP_GRP v3 auth sha TVI_Auth_2026! priv aes 128 TVI_Priv_2026!
!
end
